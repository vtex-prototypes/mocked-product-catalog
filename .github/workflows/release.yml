name: release

# Publishes every merge to main that changes what prototypes load. The logic
# lives in scripts/release.mjs, which a maintainer can also run by hand.

on:
  push:
    branches: [main]

concurrency: release

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run release
        env:
          GH_TOKEN: ${{ github.token }}
